# Production stack for Coolify (Docker Compose resource, compose path = this file).
# Coolify injects the env vars set in its UI, routes the domain to nuxt_app via
# Traefik, and prefixes the named volumes with the resource id.
# Not included: MSSQLDB/sync-idmap (SQL Server is amd64-only, the server is arm64)
# and live_transcription (Whisper on CPU). Both stay on the laptop.
services:
  pgsqldb:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    volumes:
      - hf_cache:/root/.cache/huggingface

  nuxt_app:
    build:
      context: .
      dockerfile: Dockerfile.nuxt
    environment:
      DB_HOST: pgsqldb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_LOG: 'false'
      # runtimeConfig defaults are baked at build time; NUXT_* overrides them at runtime.
      NUXT_PUBLIC_LLM_SERVICE_URL: http://fastapi:8000
      NUXT_LLM_SERVICE_URL: http://fastapi:8000
    depends_on:
      - pgsqldb
      - fastapi

volumes:
  pgdata:
  hf_cache:
