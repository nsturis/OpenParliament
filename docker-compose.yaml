services:
  MSSQLDB:
    container_name: MSSQLDB
    # Folketinget's nightly oda.bak is written by SQL Server 2025 (engine 17.0); older engines refuse it (error 3169).
    # amd64 only; on Apple Silicon Docker runs it under Rosetta.
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: ${MS_DB_PASSWORD}
      ACCEPT_EULA: 'Y'
    ports:
      - '1433:1433'
    volumes:
      - MSSQLDB:/var/opt/mssql
      - ./oda.bak:/var/opt/mssql/backup/oda.bak
    env_file:
      - .env
    networks:
      - migration_network

  pgsqldb:
    container_name: pgsqldb
    build:
      context: .
      dockerfile: Dockerfile.pgsql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - pgsqldb:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    env_file:
      - .env
    networks:
      - migration_network

  oda_pg:
    image: dimitri/pgloader:latest
    command: pgloader /data/loadfile.load
    mem_limit: 4g
    volumes:
      - ./loadfile.load:/data/loadfile.load
      - pgsqldb:/var/lib/postgresql/data
    depends_on:
      - MSSQLDB
      - pgsqldb
    env_file:
      - .env
    networks:
      - migration_network
  fastapi:
    container_name: fastapi
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    ports:
      - '8000:8000'
    env_file:
      - .env
      
  live_transcription:
    container_name: live_transcription
    build:
      context: ./live_transcription_service
      dockerfile: Dockerfile
    ports:
      - '8001:8001'
    environment:
      DB_HOST: pgsqldb
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_SERVICE_URL: http://fastapi:8000
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      STREAM_URL: ${STREAM_URL:-https://cdnapi.kaltura.com/p/2158211/sp/327418300/playManifest/entryId/1_24gfa7qq/protocol/https/format/applehttp/a.m3u8}
    depends_on:
      - pgsqldb
      - fastapi
    env_file:
      - .env
    networks:
      - migration_network

  nuxt_app:
    container_name: nuxt_app
    build:
      context: .
      dockerfile: Dockerfile.nuxt
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - pgsqldb
    networks:
      - migration_network

volumes:
  MSSQLDB:
  pgsqldb:
    # Pinned so every checkout/worktree reuses the same seeded database.
    # Without this, Compose prefixes the volume with the folder name and a
    # checkout in a different directory would start from an empty volume.
    name: podgorica_pgsqldb

networks:
  migration_network:
    driver: bridge
