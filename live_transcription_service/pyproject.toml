[project]
name = "live-transcription-service"
version = "0.1.0"
description = "Real-time transcription service for Folketinget live streams"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "faster-whisper>=1.1.0",
    "easyocr>=1.7.0",
    "opencv-python-headless>=4.10.0",
    "rapidfuzz>=3.10.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "Pillow>=10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "stream",
    "transcription",
    "ocr",
    "db",
    "reconciliation",
    "websocket",
    "meeting",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
