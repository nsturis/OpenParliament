[project]
name = "open-parliament"
version = "0.1.0"
description = "Danish parliamentary transparency platform"
requires-python = ">=3.12"
dependencies = [
    # LLM Service (FastAPI)
    "fastapi>=0.103.2",
    "uvicorn>=0.23.2",
    "pydantic>=2.9.2",
    "transformers>=4.40.0",
    "torch>=2.5.0",
    "sentence-transformers>=3.0",
    "pymupdf4llm>=0.0.27",
    # Database
    "sqlalchemy>=2.0.21",
    "psycopg2-binary>=2.9.9",
    # HTTP clients
    "httpx>=0.23.3",
    "aiohttp>=3.8.6",
    "requests>=2.32.3",
    # Web scraping
    "beautifulsoup4>=4.12.3",
    "lxml>=4.9.3",
    "selenium>=4.24.0",
    "undetected-chromedriver>=3.5.5",
    # Document processing
    "PyMuPDF>=1.24.10",
    "Pillow>=9.5.0",
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.18.1",
    "mlx-lm>=0.19.0",
]

[dependency-groups]
dev = []
